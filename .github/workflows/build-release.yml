name: Build APK & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag: v0.26.3.27-0 → VERSION=0.26.3.27, BUILD=0
          TAG="${REF_NAME#v}"
          VERSION="${TAG%-*}"
          BUILD="${TAG##*-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Build: $BUILD"

      - name: Build SDK base image
        run: docker build -t podkop-xray-sdk-apk:latest -f sdk/Dockerfile-sdk-apk sdk/

      - name: Build APK packages
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          PKG_BUILD: ${{ steps.version.outputs.build }}
        run: |
          docker build \
            --build-arg PODKOP_XRAY_VERSION="$PKG_VERSION" \
            --build-arg PODKOP_XRAY_BUILD="$PKG_BUILD" \
            -t podkop-xray-build \
            -f Dockerfile-apk .

      - name: Extract APK files
        id: apk
        run: |
          mkdir -p ./bin/apk
          docker create --name px-extract podkop-xray-build

          echo "=== Listing all APK paths inside container ==="
          docker run --rm podkop-xray-build find /builder/bin -name '*.apk' 2>/dev/null || echo "No APK files found"

          echo "=== Trying x86_64 paths ==="
          docker cp px-extract:/builder/bin/packages/x86_64/utilities/. ./bin/apk/ 2>/dev/null || true
          docker cp px-extract:/builder/bin/packages/x86_64/luci/. ./bin/apk/ 2>/dev/null || true

          echo "=== Trying all arch paths ==="
          docker cp px-extract:/builder/bin/packages/all/utilities/. ./bin/apk/ 2>/dev/null || true
          docker cp px-extract:/builder/bin/packages/all/luci/. ./bin/apk/ 2>/dev/null || true

          docker rm px-extract

          echo "=== Contents of ./bin/apk/ ==="
          ls -la ./bin/apk/ 2>/dev/null || echo "Directory empty"

          CORE_APK=$(find ./bin/apk -name 'podkop-xray_*.apk' ! -name 'luci-*' 2>/dev/null | head -1)
          LUCI_APK=$(find ./bin/apk -name 'luci-app-podkop-xray_*.apk' 2>/dev/null | head -1)

          if [ -z "$CORE_APK" ] || [ -z "$LUCI_APK" ]; then
            echo "ERROR: APK files not found"
            echo "=== Full search in ./bin/ ==="
            find ./bin/ -type f 2>/dev/null || echo "Nothing in ./bin/"
            echo "=== Trying to find inside container directly ==="
            docker run --rm podkop-xray-build find /builder/bin -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi

          echo "core=$CORE_APK" >> "$GITHUB_OUTPUT"
          echo "luci=$LUCI_APK" >> "$GITHUB_OUTPUT"
          echo "=== Found APK files ==="
          echo "Core: $CORE_APK"
          echo "LuCI: $LUCI_APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "podkop-xray ${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}"
          body: |
            ## podkop-xray ${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}

            Selective domain routing for OpenWrt using Xray-core with XHTTP transport.

            ### Installation (one command)
            ```sh
            wget -qO- https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            ### APK packages
            See attached files below.

            ### Xray-core
            Requires xray-core (installed automatically by install.sh)
          files: |
            ${{ steps.apk.outputs.core }}
            ${{ steps.apk.outputs.luci }}
