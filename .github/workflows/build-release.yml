name: Build APK & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag: v0.26.3.27-0 → VERSION=0.26.3.27, BUILD=0
          TAG="${REF_NAME#v}"
          VERSION="${TAG%-*}"
          BUILD="${TAG##*-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Build: $BUILD"

      - name: Build SDK base image
        run: docker build -t podkop-xray-sdk-apk:latest -f sdk/Dockerfile-sdk-apk sdk/

      - name: Build APK packages
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          PKG_BUILD: ${{ steps.version.outputs.build }}
        run: |
          docker build \
            --build-arg PODKOP_XRAY_VERSION="$PKG_VERSION" \
            --build-arg PODKOP_XRAY_BUILD="$PKG_BUILD" \
            -t podkop-xray-build \
            -f Dockerfile-apk .

      - name: Extract APK files
        run: |
          mkdir -p ./bin/apk
          docker create --name px-extract podkop-xray-build
          docker cp px-extract:/builder/bin/packages/x86_64/utilities/. ./bin/apk/ 2>/dev/null || true
          docker cp px-extract:/builder/bin/packages/x86_64/luci/. ./bin/apk/ 2>/dev/null || true
          docker rm px-extract
          echo "=== Built APK packages ==="
          ls -la ./bin/apk/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
          PKG_BUILD: ${{ steps.version.outputs.build }}
          REPO_NAME: ${{ github.repository }}
        run: |
          TAG="v${PKG_VERSION}-${PKG_BUILD}"

          # Find our APK files (skip luci-base, luci-i18n, etc.)
          CORE_APK=$(ls ./bin/apk/podkop-xray_*.apk 2>/dev/null | head -1)
          LUCI_APK=$(ls ./bin/apk/luci-app-podkop-xray_*.apk 2>/dev/null | head -1)

          if [ -z "$CORE_APK" ] || [ -z "$LUCI_APK" ]; then
            echo "ERROR: APK files not found"
            ls -la ./bin/apk/
            exit 1
          fi

          XRAY_VER="${PKG_VERSION#0.}"
          CORE_NAME=$(basename "$CORE_APK")
          LUCI_NAME=$(basename "$LUCI_APK")

          echo "## podkop-xray ${PKG_VERSION}-${PKG_BUILD}" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "Selective domain routing for OpenWrt using Xray-core with XHTTP transport." >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### Installation (one command)" >> /tmp/release-notes.md
          echo "\`\`\`sh" >> /tmp/release-notes.md
          echo "wget -qO- https://raw.githubusercontent.com/${REPO_NAME}/main/install.sh | sh" >> /tmp/release-notes.md
          echo "\`\`\`" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### APK packages" >> /tmp/release-notes.md
          echo "- \`${CORE_NAME}\` — core package" >> /tmp/release-notes.md
          echo "- \`${LUCI_NAME}\` — LuCI web UI" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### Xray-core" >> /tmp/release-notes.md
          echo "Requires xray-core ${XRAY_VER} (installed automatically by install.sh)" >> /tmp/release-notes.md

          echo "=== Release notes ==="
          cat /tmp/release-notes.md
          echo "=== Creating release $TAG ==="
          echo "APK files: $CORE_APK $LUCI_APK"

          gh release create "$TAG" \
            --title "podkop-xray ${PKG_VERSION}-${PKG_BUILD}" \
            --notes-file /tmp/release-notes.md \
            "$CORE_APK" \
            "$LUCI_APK"
